[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-resilience"
version = "1.0.0"
description = "Anticipatory urban resilience prediction with a multi-agent ReAct architecture."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Urban Agent Team" }]
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.2",
    "scikit-learn==1.8.0",
    "scipy==1.15.2",
    "networkx==3.1",
    "matplotlib==3.10.7",
    "fastapi==0.120.2",
    "pydantic==2.10.6",
    "uvicorn==0.38.0",
    "rich==13.3.5",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "ruff==0.14.2",
]

[project.scripts]
urban-resilience = "urban_resilience.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["urban_resilience*"]
exclude = ["tests*", "data*", "outputs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".pytest_cache", ".ruff_cache", "__pycache__", "outputs", "data"]
